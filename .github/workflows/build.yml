name: Build Spectrum PEAK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Spectrum.PEAK.slnx

      - name: Build
        run: dotnet build Spectrum.PEAK.slnx --configuration Release --no-restore

      - name: Upload plugin assembly
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum.PEAK-${{ github.sha }}
          path: artifacts/bin/Spectrum.PEAK/Release/netstandard2.1/Spectrum.PEAK.dll
          if-no-files-found: error
          retention-days: 14
